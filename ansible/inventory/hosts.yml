# Hosts are named by their short hostname (`hostname -s`); scripts/converge-system.sh
# limits each run to the machine it is executed on.
all:
  children:
    workstation:
      hosts:
        innom-dt:
          ansible_connection: local
        ms-test:  # disposable test VM, see scripts/test-vm.sh
          ansible_connection: local
    # Deployment targets, managed over SSH from the workstation. Populated when
    # their roles are written.
    jetson:
      hosts: {}
    rpi:
      hosts: {}
