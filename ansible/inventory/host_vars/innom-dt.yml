primary_user: innom-dt
nvidia_gpu: true

# Internal data drives (see docs/design.md, drive layout). Not yet converted:
# 860 EVO (games), BX500 x2 (archive, backup); their old fstab entries stay
# unmanaged until then.
mounts_list:
  - path: /mnt/projects
    uuid: 236ab511-7295-4f29-9c99-fb4eae296fca  # WD SN850X 8TB ...0960
    fstype: ext4
    name: Projects
    mode: "0700"
  - path: /mnt/data
    uuid: abf2e6ae-34f3-42f8-8cbe-ff296c939504  # WD SN850X 8TB ...0499
    fstype: ext4
    name: Data

mounts_aliases:
  - path: /mnt/SN850X_8TB_EXT4  # old projects path; conda envs and tools refer to it
    target: /mnt/projects

mounts_retired:
  - /mnt/SN850X_8TB_EXT4  # now /mnt/projects (alias above)
  - /mnt/SN850X_8TB       # reformatted as /mnt/data
  - /mnt/SN850X_8TB_2     # stale entry from before that drive became ext4
