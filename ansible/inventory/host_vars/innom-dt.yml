primary_user: innom-dt
nvidia_gpu: true

# Internal data drives (see docs/design.md, drive layout).
mounts_list:
  - path: /mnt/projects
    uuid: PROJECTS_FS_UUID
    fstype: ext4
    name: Projects
    mode: "0700"
  - path: /mnt/data
    uuid: DATA_FS_UUID
    fstype: ext4
    name: Data

mounts_aliases:
  - path: /mnt/SN850X_8TB_EXT4  # old projects path; conda envs and tools refer to it
    target: /mnt/projects

mounts_retired:
  - /mnt/SN850X_8TB_EXT4  # now /mnt/projects (alias above)
  - /mnt/SN850X_8TB       # reformatted as /mnt/data
  - /mnt/SN850X_8TB_2     # stale entry from before that drive became ext4
