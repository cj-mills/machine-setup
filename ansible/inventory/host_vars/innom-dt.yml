primary_user: innom-dt
nvidia_gpu: true

# Keeps NVMe drives out of low-power states. Set by hand on the 24.04 install; whether
# these drives still need it isn't known, and a desktop loses nothing by keeping it.
base_grub_cmdline_extra:
  - nvme_core.default_ps_max_latency_us=0

# Internal data drives: their UUIDs are the machine's own facts, kept in the private
# inventory overlay (scripts/converge-system.sh), not here. The mounts role stops if
# the overlay wasn't found.
mounts_private: true

# The old projects mount point, now a plain folder: the cjm-era tools hard-code paths
# under it.
mounts_links:
  - path: /mnt/SN850X_8TB_EXT4/Projects/GitHub/cj-mills
    target: /mnt/projects/archive/cjm-era
  - path: /mnt/SN850X_8TB_EXT4/claude-code-scratchpads
    target: /mnt/projects/archive/cjm-era/claude-code-scratchpads
  - path: /mnt/SN850X_8TB_EXT4/Model_Cache
    target: /mnt/data/models

# Test VMs (scripts/test-vm.sh) live on the data drive.
test_vms_root: /mnt/data/vm

mounts_retired:
  - /mnt/SN850X_8TB       # reformatted as /mnt/data
  - /mnt/SN850X_8TB_2     # stale entry from before that drive became ext4
