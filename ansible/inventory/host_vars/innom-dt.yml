primary_user: innom-dt
nvidia_gpu: true

# Keeps NVMe drives out of low-power states. Set by hand on the 24.04 install; whether
# these drives still need it isn't known, and a desktop loses nothing by keeping it.
base_grub_cmdline_extra:
  - nvme_core.default_ps_max_latency_us=0

# Internal data drives (see docs/design.md, drive layout).
mounts_list:
  - path: /mnt/projects
    uuid: PROJECTS_FS_UUID
    fstype: ext4
    name: Projects
    mode: "0700"
  - path: /mnt/data
    uuid: DATA_FS_UUID
    fstype: ext4
    name: Data
  - path: /mnt/backup
    uuid: BACKUP_FS_UUID  # set by prepare-data-disk.sh
    fstype: ext4
    name: Backup
    mode: "0700"

mounts_aliases:
  - path: /mnt/SN850X_8TB_EXT4  # old projects path, still used by tools and session history
    target: /mnt/projects

# Test VMs (scripts/test-vm.sh) live on the data drive.
test_vms_root: /mnt/data/vm

mounts_retired:
  - /mnt/SN850X_8TB       # reformatted as /mnt/data
  - /mnt/SN850X_8TB_2     # stale entry from before that drive became ext4
