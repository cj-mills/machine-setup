# Internal data drives, mounted by filesystem UUID at purpose-named paths
# (/mnt/projects, /mnt/data, ...) so paths survive a drive replacement.
#
# mounts_list entries:
#   path    mount point
#   uuid    filesystem UUID (`lsblk -o NAME,UUID,LABEL`)
#   fstype  e.g. ext4
#   name    optional display name in the file manager sidebar
#   opts    mount options (default: defaults,nofail,x-gvfs-show)
#   owner, group, mode   applied to the filesystem's root directory
#                        (default: primary_user, primary_user, 0755)
mounts_list: []

# True for a host whose mounts_list comes from the private inventory overlay
# (scripts/converge-system.sh): the role then stops if the list is empty, rather than
# converging that machine without its drives.
mounts_private: false

# Compatibility links at old paths, for tools that hard-code them. Each: path (old),
# target. Parent directories are created; the target may not exist yet.
mounts_links: []

# Mount points to drop from fstab without unmounting them; they are simply not
# mounted at the next boot. Use for paths that are in use while converging.
mounts_retired: []
