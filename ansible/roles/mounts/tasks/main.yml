- name: Require the private inventory for hosts whose drives are kept there
  ansible.builtin.assert:
    that: mounts_list | length > 0
    fail_msg: >-
      {{ inventory_hostname }}'s mounts come from the private inventory overlay, which
      scripts/converge-system.sh didn't find (MACHINE_SETUP_PRIVATE, the hub, or
      /etc/machine-setup/inventory).
    quiet: true
  when: mounts_private

- name: Mount data filesystems
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    opts: >-
      {{ item.opts | default('defaults,nofail,x-gvfs-show') }}{{
         (',x-gvfs-name=' ~ item.name) if item.name is defined else '' }}
    state: mounted
  loop: "{{ mounts_list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Set ownership of each filesystem's root directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(primary_user) }}"
    group: "{{ item.group | default(primary_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ mounts_list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Drop retired mount points from fstab (they stay mounted until the next boot)
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent_from_fstab
  loop: "{{ mounts_retired }}"

- name: Create parent directories of compatibility links
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
    mode: "0755"
  loop: "{{ mounts_links | map(attribute='path') | map('dirname') | unique }}"

- name: Create compatibility links
  ansible.builtin.file:
    path: "{{ item.path }}"
    src: "{{ item.target }}"
    state: link
    follow: false
    force: true  # the target may not exist yet
    owner: "{{ primary_user }}"
    group: "{{ primary_user }}"
  loop: "{{ mounts_links }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.target }}"
