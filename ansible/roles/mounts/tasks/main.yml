- name: Mount data filesystems
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    opts: >-
      {{ item.opts | default('defaults,nofail,x-gvfs-show') }}{{
         (',x-gvfs-name=' ~ item.name) if item.name is defined else '' }}
    state: mounted
  loop: "{{ mounts_list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Set ownership of each filesystem's root directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(primary_user) }}"
    group: "{{ item.group | default(primary_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ mounts_list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Drop retired mount points from fstab (they stay mounted until the next boot)
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent_from_fstab
  loop: "{{ mounts_retired }}"

- name: Define compatibility bind mounts in fstab
  # A bind mount (unlike a symlink) keeps the old path as the path programs see,
  # so tools that record their working directory behave exactly as before.
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.target }}"
    fstype: none
    opts: "bind,nofail,x-systemd.requires-mounts-for={{ item.target }}"
    state: present
  loop: "{{ mounts_aliases }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.target }}"

- name: Activate compatibility bind mounts not mounted yet
  # A path still mounted some other way (e.g. directly from the device, before the
  # first reboot) switches over to the bind mount at the next boot.
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.target }}"
    fstype: none
    opts: "bind,nofail,x-systemd.requires-mounts-for={{ item.target }}"
    state: mounted
  loop: "{{ mounts_aliases }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.target }}"
  when: item.path not in (ansible_facts.mounts | map(attribute='mount') | list)
