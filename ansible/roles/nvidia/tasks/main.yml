# Host provides the driver, the container runtime hook and the GPU profiler only.
# CUDA toolkits come from project environments (conda/pip wheels) or container images.

- name: NVIDIA driver and container toolkit
  when: nvidia_gpu
  block:
    # Before the driver, so the module's first load already has it.
    - name: Allow GPU profiling without root
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nvidia-profiling.conf
        content: "options nvidia NVreg_RestrictProfilingToAdminUsers=0\n"
        mode: "0644"
      notify: Report reboot needed

    - name: Install NVIDIA driver (open kernel modules)
      ansible.builtin.apt:
        name:
          - "nvidia-driver-{{ nvidia_driver_branch }}-open"
          - "linux-modules-nvidia-{{ nvidia_driver_branch }}-open-{{ nvidia_kernel_flavour }}"
        state: present
      notify: Report reboot needed

    # 32-bit programs such as Steam (roles/steam enables i386) need the driver's 32-bit
    # libraries. The driver package recommends them, so apt adds them when i386 is
    # enabled before the driver is installed, but not when i386 comes later. This
    # installs that same set either way, at the installed driver's exact version: they
    # are Multi-Arch "same" packages, and apt would otherwise upgrade the 64-bit
    # libraries past the loaded kernel module to match.
    - name: Read foreign architectures
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: nvidia_foreign_architectures
      changed_when: false

    - name: Read the installed driver's version
      ansible.builtin.command: >-
        dpkg-query -W -f=${Version} nvidia-driver-{{ nvidia_driver_branch }}-open
      register: nvidia_driver_version
      changed_when: false
      when: "'i386' in nvidia_foreign_architectures.stdout_lines"

    - name: Install the driver's 32-bit libraries
      ansible.builtin.apt:
        name: >-
          {{ ['libnvidia-compute', 'libnvidia-decode', 'libnvidia-encode', 'libnvidia-fbc1',
              'libnvidia-gl']
             | product(['-' ~ nvidia_driver_branch ~ ':i386=' ~ nvidia_driver_version.stdout])
             | map('join') | list }}
        state: present
      when: "'i386' in nvidia_foreign_architectures.stdout_lines"

    - name: Install Nsight Compute
      ansible.builtin.apt:
        name: nsight-compute
        state: present

    - name: Configure NVIDIA Container Toolkit repository
      ansible.builtin.include_role:
        name: vendor_repos
        tasks_from: repo
      vars:
        vendor_repos_repo: "{{ nvidia_container_toolkit_repo }}"

    - name: Refresh apt cache after repository changes
      ansible.builtin.apt:
        update_cache: true
      when: vendor_repos_changed | default(false)

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present

    - name: Read Docker daemon configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: nvidia_docker_daemon_json
      failed_when: false

    - name: Register the NVIDIA runtime with Docker
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      when: >-
        nvidia_docker_daemon_json.content is not defined
        or 'nvidia' not in ((nvidia_docker_daemon_json.content | b64decode | from_json).runtimes | default({}))
      changed_when: true
      notify: Restart docker
