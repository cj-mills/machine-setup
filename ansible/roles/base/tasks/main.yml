- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages + (extra_packages | default([])) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set extra kernel parameters
  ansible.builtin.copy:
    dest: /etc/default/grub.d/90-machine-setup.cfg
    content: |
      # Managed by machine-setup (ansible/roles/base, base_grub_cmdline_extra).
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT {{ base_grub_cmdline_extra | join(' ') }}"
    mode: "0644"
  when: base_grub_cmdline_extra | length > 0
  notify: Update GRUB

# The kernel's attachment matcher mishandles diff-encoded DFAs, so a profile whose
# attachment nests alternations never attaches, silently: Ubuntu's `firefox`, which grants
# Mozilla's deb the user namespaces its sandbox needs. Drop this once the kernel is fixed
# (https://gitlab.com/apparmor/apparmor-kernel/-/issues/8;
# docs/decisions/2026-11-02-apparmor-no-diff-encode.md).
- name: Compile AppArmor policy without diff encoding
  ansible.builtin.lineinfile:
    path: /etc/apparmor/parser.conf
    line: Optimize=no-diff-encode
  notify: Recompile AppArmor policy
