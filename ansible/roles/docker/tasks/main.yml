# Docker packages and their repository come from vendor_repos.

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add the primary user to the docker group
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: docker
    append: true
  when: docker_user_in_group
